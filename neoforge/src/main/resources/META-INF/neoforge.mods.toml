modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
issueTrackerURL = "https://github.com/CreeperHost/BackupManager/issues"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
iconFile = "backupmanager.png"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.backupmanager]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.backupmanager]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.backupmanager]]
modId = "polylib"
type = "required"
versionRange = "[${polylib_min_version},)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "backupmanager-common.mixins.json"
